name: CI & Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html is missing!"; exit 1; }
          test -d dist/assets || { echo "dist/assets directory is missing!"; exit 1; }
          echo "Production build passed verification successfully!"
